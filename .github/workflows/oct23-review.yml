name: October23 independent CI consumer review
on:
  push:
    branches: [ci/oct23-vc-cmux24520-v2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Actual consumer and worker owner verification
        run: python3 validation/controller.py
      - name: Preserve bounded result on success or failure
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          p=Path('/tmp/oct23-cmux-proof/result.json')
          if p.exists():
              raw=p.read_bytes()
              assert len(raw)<=8*1024**2
              chunks=[raw[i:i+24576] for i in range(0,len(raw),24576)]
              print('OCT23_FINAL_META='+json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'chunks':len(chunks)}))
              for index,chunk in enumerate(chunks):
                  print('OCT23_FINAL_CHUNK='+json.dumps({'index':index,'total':len(chunks),'data':base64.b64encode(chunk).decode()}))
          PY
