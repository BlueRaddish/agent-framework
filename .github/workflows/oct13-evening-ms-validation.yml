name: Oct13 evening Microsoft frozen validation
on:
  push:
    branches: ['ci/oct13-evening-ms-validation']
permissions:
  contents: read
jobs:
  source-validation:
    name: source-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: microsoft/agent-framework
          ref: 1b9879c58ac950ef235471209b4c5cb402972bab
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Execute frozen source-validation
        run: python .ci-reviews/_mm_validation.py --scope ms-evening --phase source-validation --source source
  user-verification-ms-evening:
    name: user-verification-ms-evening
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: microsoft/agent-framework
          ref: 1b9879c58ac950ef235471209b4c5cb402972bab
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Execute frozen personal-verification
        run: python .ci-reviews/_mm_validation.py --scope ms-evening --phase personal-verification --source source
