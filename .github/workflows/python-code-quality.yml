name: October25 existing default workflow dispatch diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/oct25b-mm-create-event-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Record selected event identity only
        env:
          PROBE_EVENT: ${{ github.event_name }}
          PROBE_REF: ${{ github.ref }}
          PROBE_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os
          print('OCT25B_DISPATCH_PROBE='+json.dumps({k:os.environ[k] for k in ['PROBE_EVENT','PROBE_REF','PROBE_HEAD']}))
          PY
