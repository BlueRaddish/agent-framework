name: October25b cmux portable cancellation source verification
on:
  push:
    branches: [ci/oct25b-vc-cmux-source]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 validation/controller.py
      - if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          p=Path('/tmp/oct25b-vc-cmux-proof/result.json')
          if p.exists():
              raw=p.read_bytes();assert len(raw)<8*1024**2
              chunks=[raw[i:i+24576]for i in range(0,len(raw),24576)]
              print('OCT25B_FINAL_META='+json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'chunks':len(chunks)}))
              for i,c in enumerate(chunks):print('OCT25B_FINAL_CHUNK='+json.dumps({'index':i,'total':len(chunks),'data':base64.b64encode(c).decode()}))
          PY
