name: Verify telemetry operator recipe
on:
  push:
    branches: [ci/oct25b-ao-telemetry-docs]
permissions:
  contents: read
jobs:
  adk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.11'
            lane: py311
          - version: '3.12'
            lane: py312
          - version: '3.13'
            lane: py313
          - version: '3.14'
            lane: py314
    env:
      PYTHON_VERSION: ${{ matrix.version }}
      TOX_LANE: ${{ matrix.lane }}
      UV_EXCLUDE_NEWER: '2026-10-26T00:00:00Z'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: runner-control
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: google/adk-python
          ref: bf6739723c1b8b03bff8bb1e6ffada4d88098fcf
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Execute documented environment recipe and required source checks
        working-directory: source
        run: python ../runner-control/validation/verify.py
